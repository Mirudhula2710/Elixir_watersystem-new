{% extends 'base.html' %}
{% block title %}Login - Campus Water System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-slate-900/85 backdrop-blur-2xl shadow-2xl rounded-3xl overflow-hidden border border-cyan-500/30 text-white">
        <div class="bg-gradient-to-r from-blue-950 via-cyan-950 to-slate-900 text-white p-6 text-center border-b border-cyan-500/20">
            <div class="inline-block bg-cyan-500/20 backdrop-blur-md p-3.5 rounded-full text-cyan-300 mb-3 shadow-inner border border-cyan-400/30">
                <i class="fa-solid fa-water text-3xl text-cyan-300"></i>
            </div>
            <h2 class="text-2xl font-extrabold tracking-tight text-white">Welcome Back</h2>
            <p class="text-cyan-100 text-sm mt-1">Sign in to your account</p>
        </div>
        <div class="p-8">
            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-white mb-2"><i class="fa-solid fa-user text-cyan-400 mr-2"></i>Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-2.5 bg-slate-800/90 border border-cyan-500/30 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 text-white placeholder-cyan-200/50 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-2"><i class="fa-solid fa-lock text-cyan-400 mr-2"></i>Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2.5 bg-slate-800/90 border border-cyan-500/30 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 text-white outline-none transition-all">
                </div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 rounded-xl shadow-lg text-sm font-extrabold text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 transition-all">
                    Login
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-cyan-500/20 text-center">
                <p class="text-xs text-white mb-3 font-extrabold uppercase tracking-wider">Demo Accounts (Password: password)</p>
                <div class="flex justify-center gap-2 flex-wrap">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-cyan-950 text-white shadow-sm border border-cyan-400/40">manager</span>
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-950 text-white shadow-sm border border-emerald-400/40">worker1</span>
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-purple-950 text-white shadow-sm border border-purple-400/40">student1</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
